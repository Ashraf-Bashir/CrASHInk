name: Build crASHink X4 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Get latest CrossInk release
        id: get-release
        run: |
          LATEST=$(curl -s https://api.github.com/repos/uxjulia/CrossInk/releases/latest | jq -r '.tag_name')
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Building CrossInk $LATEST"

      - name: Clone CrossInk
        run: |
          git clone --depth 1 --branch ${{ steps.get-release.outputs.version }} https://github.com/uxjulia/CrossInk.git source
          cd source
          git submodule update --init --recursive

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('source/platformio.ini') }}
          restore-keys: ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Apply patches
        run: |
          cd source
          for p in ../patches/*.patch; do
            echo "Applying $(basename "$p")"
            git apply --verbose "$p"
          done
          grep -n "CLIPPING_MAX_PER_BOOK" src/ClippingStore.h
          grep -n "Delete Clipping?" src/activities/reader/EpubReaderActivity.cpp

      - name: Build X4 Pro
        run: |
          cd source
          pio run -e x4-pro
          VERSION="${{ steps.get-release.outputs.version }}"
          mkdir -p ../builds
          cp .pio/build/x4-pro/firmware.bin "../builds/crASHink-${VERSION}-x4pro.bin"
          ls -lh ../builds/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: crASHink-${{ steps.get-release.outputs.version }}-x4pro
          path: builds/crASHink-*.bin
          retention-days: 30
