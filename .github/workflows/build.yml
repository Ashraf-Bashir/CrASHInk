name: Build crASHink X4 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.pio-build-cache
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Get latest CrossInk release
        id: get-release
        run: |
          LATEST=$(git -c versionsort.suffix=-rc ls-remote --tags --refs --sort=version:refname https://github.com/uxjulia/CrossInk.git | awk '{print $2}' | sed 's#refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-rc.*)?$' | tail -1)
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Building CrossInk $LATEST"

      - name: Clone CrossInk
        run: |
          git clone --depth 1 --branch ${{ steps.get-release.outputs.version }} https://github.com/uxjulia/CrossInk.git source
          cd source
          git submodule update --init --recursive

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          # Cache downloaded tools, not the Python-version-specific virtualenv.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-tools-v2-${{ hashFiles('source/platformio.ini') }}
          restore-keys: ${{ runner.os }}-platformio-tools-v2-

      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ${{ env.PLATFORMIO_BUILD_CACHE_DIR }}
          # Each run saves an updated cache; restore unchanged objects from the
          # latest compatible build. Source/flag changes are checked by SCons.
          key: ${{ runner.os }}-x4-pro-objects-v1-${{ hashFiles('source/platformio.ini') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-x4-pro-objects-v1-${{ hashFiles('source/platformio.ini') }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Apply patches
        run: |
          cd source
          for p in ../patches/*; do
            echo "Applying $(basename "$p")"
            git apply --verbose "$p"
          done
          grep -n "CLIPPING_MAX_PER_BOOK" src/ClippingStore.h
          grep -n "showClippingEditor" src/activities/reader/EpubReaderActivity.cpp

      - name: Build X4 Pro
        run: |
          cd source
          VERSION="${{ steps.get-release.outputs.version }}"
          STAMP=$(TZ=Europe/Amsterdam date +%Y%m%d%H%M)
          # Only BootActivity includes this header; the changing timestamp
          # must not invalidate every library/compiler command.
          printf '#pragma once\n#define CRASHINK_BUILD "%s.%s"\n' "$VERSION" "$STAMP" > src/CrASHinkBuild.h
          pio run -e x4-pro
          mkdir -p ../builds
          cp .pio/build/x4-pro/firmware.bin "../builds/crASHink-${VERSION}.${STAMP}-x4pro.bin"
          ls -lh ../builds/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: crASHink-${{ steps.get-release.outputs.version }}-x4pro
          path: builds/crASHink-*.bin
          retention-days: 30
