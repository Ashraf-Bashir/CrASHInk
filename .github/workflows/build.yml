name: Build crASHink X4 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio && pio platform install espressif32

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('source/**/platformio.ini') }}
          restore-keys: ${{ runner.os }}-platformio-

      - name: Get latest CrossInk release
        id: get-release
        run: |
          LATEST=$(curl -s https://api.github.com/repos/uxjulia/CrossInk/releases/latest | jq -r '.tag_name')
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Building CrossInk $LATEST"

      - name: Clone CrossInk
        run: |
          git clone --depth 1 --branch ${{ steps.get-release.outputs.version }} https://github.com/uxjulia/CrossInk.git source
          cd source
          git submodule update --init --recursive

      - name: Apply patches
        run: |
          cd source
          echo "🔧 Applying code patches..."

          # Unlimited clippings
          sed -i 's/CLIPPING_MAX_PER_BOOK = [0-9]\+/CLIPPING_MAX_PER_BOOK = 65535/' src/ClippingStore.h

          # Clickable clippings modal - replace navigation with modal dialog
          FILE="src/activities/reader/EpubReaderClippingListActivity.cpp"

          sed -i 's/jumpToSelectedClipping();/showClippingActionMenu(false);/g' "$FILE"
          sed -i 's/openSelectedDetail();/showClippingActionMenu(false);/g' "$FILE"

          echo "✅ Modal dialog patches applied"

          echo "✅ Code patches applied"

      - name: Build X4 Pro
        run: |
          cd source
          pio run -e x4-pro

          # Rename binary with version
          VERSION="${{ steps.get-release.outputs.version }}"
          mkdir -p ../builds
          cp .pio/build/x4-pro/firmware.bin "../builds/crASHink-${VERSION}-x4pro.bin"
          ls -lh ../builds/

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: crASHink-x4pro-firmware
          path: builds/crASHink-*.bin
          retention-days: 30
