name: Build crASHink X4 Pro

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'CrossInk baseline (each version uses its own pinned feature patches)'
        type: choice
        default: '1.6.1'
        options:
          - '1.6.1'
      runner:
        description: 'Free build runner (try the other version if GitHub cannot start a job)'
        type: choice
        default: ubuntu-22.04
        options:
          - ubuntu-22.04
          - ubuntu-24.04

permissions:
  contents: read

jobs:
  build:
    # Both choices are standard GitHub-hosted runners; no paid runner is used.
    runs-on: ${{ inputs.runner || 'ubuntu-22.04' }}
    env:
      PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.pio-build-cache
    outputs:
      firmware-artifact: ${{ steps.raw.outputs.artifact-id }}
      patch-directory: ${{ steps.get-release.outputs.patch-directory }}
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Resolve pinned CrossInk baseline
        id: get-release
        env:
          BASELINE: ${{ inputs.baseline || '1.6.1' }}
        run: python3 scripts/resolve_crashink_patchset.py "$BASELINE" --github-output "$GITHUB_OUTPUT"

      - name: Clone pinned CrossInk and SDK
        env:
          UPSTREAM: ${{ steps.get-release.outputs.repository }}
          UPSTREAM_COMMIT: ${{ steps.get-release.outputs.commit }}
          SDK_COMMIT: ${{ steps.get-release.outputs.sdk-commit }}
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "$UPSTREAM"
          git -C source fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          git -C source submodule update --init --recursive
          test "$(git -C source/freeink-sdk rev-parse HEAD)" = "$SDK_COMMIT"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          # Cache downloaded tools, not the Python-version-specific virtualenv.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-tools-v2-${{ hashFiles('source/platformio.ini') }}
          restore-keys: ${{ runner.os }}-platformio-tools-v2-

      - name: Cache project dependencies
        uses: actions/cache@v4
        with:
          path: source/.pio/libdeps
          key: ${{ runner.os }}-x4-pro-libdeps-v1-${{ hashFiles('source/platformio.ini', 'source/platformio.local.example.ini') }}

      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ${{ env.PLATFORMIO_BUILD_CACHE_DIR }}
          # Each run saves an updated cache; restore unchanged objects from the
          # latest compatible build. Source/flag changes are checked by SCons.
          key: ${{ runner.os }}-x4-pro-objects-v1-${{ hashFiles('source/platformio.ini') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-x4-pro-objects-v1-${{ hashFiles('source/platformio.ini') }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Apply matching feature patches
        env:
          PATCH_DIRECTORY: ${{ steps.get-release.outputs.patch-directory }}
        run: |
          set -euo pipefail
          cd source
          for p in ../"$PATCH_DIRECTORY"/*.patch; do
            echo "Applying $(basename "$p")"
            git apply --verbose "$p"
          done
          for p in ../"$PATCH_DIRECTORY"/sdk/*.patch; do
            echo "Applying FreeInk SDK patch $(basename "$p")"
            git -C freeink-sdk apply --verbose "../$p"
          done
          grep -n "CLIPPING_MAX_PER_BOOK" src/ClippingStore.h
          grep -n "showClippingEditor" src/activities/reader/EpubReaderActivity.cpp

      - name: Build X4 Pro
        run: |
          cd source
          VERSION="${{ steps.get-release.outputs.version }}"
          STAMP=$(TZ=Europe/Amsterdam date +%Y%m%d%H%M)
          # Only BootActivity includes this header; the changing timestamp
          # must not invalidate every library/compiler command.
          printf '#pragma once\n#define CRASHINK_BUILD "%s.%s"\n' "$VERSION" "$STAMP" > src/CrASHinkBuild.h
          pio run -e x4-pro
          mkdir -p ../builds
          cp .pio/build/x4-pro/firmware.bin "../builds/crASHink-${VERSION}.${STAMP}-x4pro.bin"
          ls -lh ../builds/

      - name: Upload regular firmware
        id: raw
        uses: actions/upload-artifact@v7
        with:
          path: builds/crASHink-*.bin
          archive: false
          if-no-files-found: error
          retention-days: 30

  sign-wifi-firmware:
    name: Sign Wi-Fi firmware
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.firmware-artifact }}
          path: builds
      - name: Sign and verify firmware
        env:
          CRASHINK_WIFI_SIGNING_KEY: ${{ secrets.CRASHINK_WIFI_SIGNING_KEY }}
          PATCH_DIRECTORY: ${{ needs.build.outputs.patch-directory }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRASHINK_WIFI_SIGNING_KEY" || { echo 'Missing CRASHINK_WIFI_SIGNING_KEY'; exit 1; }
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$CRASHINK_WIFI_SIGNING_KEY" > "$key"
          unset CRASHINK_WIFI_SIGNING_KEY

          sed -n '/^+constexpr char SIGNING_PUBLIC_KEY/,/^+)pem";/p' "$PATCH_DIRECTORY/0016-wifi-firmware-updater.patch" |
            sed -e '1s/.*R"pem(//' -e '1!s/^+//' -e '$d' > builds/receiver-public.pem
          openssl pkey -in "$key" -pubout | cmp - builds/receiver-public.pem

          shopt -s nullglob
          images=(builds/crASHink-*-x4pro.bin)
          test "${#images[@]}" -eq 1
          raw=${images[0]}
          signed="${raw%-x4pro.bin}-wifi-x4pro.bin"
          python3 tools/android-updater/sign-firmware.py "$raw" "$signed" --key "$key"
          python3 - "$raw" "$signed" <<'PYVERIFY'
          from pathlib import Path
          import sys

          raw = Path(sys.argv[1]).read_bytes()
          signed = Path(sys.argv[2]).read_bytes()
          marker = b"CRASHOTA1"
          signature = signed[len(raw):-len(marker)]
          if not signed.startswith(raw) or not signed.endswith(marker) or len(signature) != 256:
              raise SystemExit("Signed bundle does not contain the exact raw firmware and signature")
          Path("builds/firmware.sig").write_bytes(signature)
          PYVERIFY
          openssl dgst -sha256 -verify builds/receiver-public.pem -signature builds/firmware.sig "$raw"
      - name: Upload signed Wi-Fi firmware
        uses: actions/upload-artifact@v7
        with:
          path: builds/crASHink-*-wifi-x4pro.bin
          archive: false
          if-no-files-found: error
          retention-days: 30
