name: Build crASHink X4 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio && pio platform install espressif32

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('source/**/platformio.ini') }}
          restore-keys: ${{ runner.os }}-platformio-

      - name: Get latest CrossInk release
        id: get-release
        run: |
          LATEST=$(curl -s https://api.github.com/repos/uxjulia/CrossInk/releases/latest | jq -r '.tag_name')
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Building CrossInk $LATEST"

      - name: Clone CrossInk
        run: |
          git clone --depth 1 --branch ${{ steps.get-release.outputs.version }} https://github.com/uxjulia/CrossInk.git source
          cd source
          git submodule update --init --recursive

      - name: Apply patches
        run: |
          cd source
          echo "🔧 Applying code patches..."

          # Unlimited clippings
          sed -i 's/CLIPPING_MAX_PER_BOOK = [0-9]\+/CLIPPING_MAX_PER_BOOK = 65535/' src/ClippingStore.h

          # Clickable clippings modal
          FILE="src/activities/reader/EpubReaderClippingListActivity.cpp"

          # Add Cancel menu item
          sed -i '/items.push_back({FileBrowserAction::Delete, StrId::STR_DELETE});/a\  items.push_back({FileBrowserAction::Cancel, StrId::STR_CANCEL});' "$FILE"

          # Replace jumpToSelectedClipping with modal
          sed -i 's/jumpToSelectedClipping();/showClippingActionMenu(false);/' "$FILE"

          # Replace openSelectedDetail with modal
          sed -i 's/openSelectedDetail();/showClippingActionMenu(false);/' "$FILE"

          echo "✅ Code patches applied"

      - name: Build X4 Pro
        run: |
          cd source
          pio run -e x4-pro
          ls -lh .pio/build/x4-pro/firmware.bin
