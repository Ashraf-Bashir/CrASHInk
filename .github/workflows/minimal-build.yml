name: Build crASHink X4 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio && pio platform install espressif32

      - name: Clone CrossInk
        run: git clone --depth 1 https://github.com/uxjulia/CrossInk.git source

      - name: Apply patches
        run: |
          cd source
          git apply ../patches/0001-remove-clipping-limit.patch
          git apply ../patches/0002-clickable-clippings-with-modal-dialog.patch

      - name: Build X4 Pro
        run: |
          cd source
          pio run -e x4-pro

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: crASHink-x4pro
          path: source/.pio/build/x4-pro/firmware.bin
