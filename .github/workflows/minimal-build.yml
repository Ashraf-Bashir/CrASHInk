name: Build crASHink X4 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio && pio platform install espressif32

      - name: Get latest CrossInk release
        id: get-release
        run: |
          LATEST=$(curl -s https://api.github.com/repos/uxjulia/CrossInk/releases/latest | jq -r '.tag_name')
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Building CrossInk $LATEST"

      - name: Clone CrossInk
        run: git clone --depth 1 --branch ${{ steps.get-release.outputs.version }} https://github.com/uxjulia/CrossInk.git source

      - name: Apply patches
        run: |
          cd source
          git apply ../patches/0001-remove-clipping-limit.patch
          git apply ../patches/0002-clickable-clippings-with-modal-dialog.patch

      - name: Build X4 Pro
        run: |
          cd source
          pio run -e x4-pro
          ls -lh .pio/build/x4-pro/firmware.bin
