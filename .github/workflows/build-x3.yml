name: Build crASHink X3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Get latest CrossInk release
        id: get-release
        run: |
          LATEST=$(git -c versionsort.suffix=-rc ls-remote --tags --refs --sort=version:refname https://github.com/uxjulia/CrossInk.git | awk '{print $2}' | sed 's#refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-rc.*)?$' | tail -1)
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Building CrossInk $LATEST"

      - name: Clone CrossInk
        run: |
          git clone --depth 1 --branch ${{ steps.get-release.outputs.version }} https://github.com/uxjulia/CrossInk.git source
          cd source
          git submodule update --init --recursive

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-x3-${{ hashFiles('source/platformio.ini') }}
          restore-keys: ${{ runner.os }}-platformio-x3-

      - name: Install PlatformIO
        # Same PlatformIO core upstream CI uses (plain pip platformio breaks the IDF lib build for env default).
        run: pip install -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      # The X3 is button-only: skip the touch-driven patches (instant highlight and
      # its status-bar icon). Everything else is shared with the X4 Pro build.
      - name: Apply patches
        run: |
          cd source
          for p in ../patches/*; do
            case "$(basename "$p")" in
              0007-*|0011-*) echo "Skipping $(basename "$p") (touch only)"; continue ;;
            esac
            echo "Applying $(basename "$p")"
            git apply --verbose "$p"
          done
          grep -n "CLIPPING_MAX_PER_BOOK" src/ClippingStore.h

      - name: Build X3
        run: |
          cd source
          VERSION="${{ steps.get-release.outputs.version }}"
          STAMP=$(TZ=Europe/Amsterdam date +%Y%m%d%H%M)
          # No Readest Auto-Sync on the X3 (RAM); manual sync from the book menu stays.
          export PLATFORMIO_BUILD_FLAGS="-DCROSSINK_READEST_AUTOSYNC=0 -DCRASHINK_BUILD=\\\"${VERSION}.${STAMP}\\\""
          pio run -e default
          mkdir -p ../builds
          cp .pio/build/default/firmware.bin "../builds/crASHink-${VERSION}.${STAMP}-x3.bin"
          ls -lh ../builds/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: crASHink-${{ steps.get-release.outputs.version }}-x3
          path: builds/crASHink-*.bin
          retention-days: 30
