name: Auto-build CrASHInk on Release

on:
  schedule:
    # Check for new releases every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allow manual trigger from Actions tab

env:
  PLATFORMIO_CACHE_DIR: ~/.platformio

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      new-release: ${{ steps.check.outputs.new-release }}
      release-tag: ${{ steps.check.outputs.release-tag }}
    steps:
      - name: Check for new CrossInk release
        id: check
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/uxjulia/CrossInk/releases/latest | jq -r '.tag_name')
          CURRENT_TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name // empty')

          if [ "$LATEST_TAG" != "$CURRENT_TAG" ] && [ ! -z "$LATEST_TAG" ]; then
            echo "new-release=true" >> $GITHUB_OUTPUT
            echo "release-tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          else
            echo "new-release=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-release
    if: needs.check-release.outputs.new-release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ['default', 'sticky', 'x4-pro']
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG=$(curl -s https://api.github.com/repos/uxjulia/CrossInk/releases/latest | jq -r '.tag_name')
          else
            TAG=${{ needs.check-release.outputs.release-tag }}
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Clone CrossInk at release tag
        run: |
          git clone --depth 1 --branch ${{ steps.tag.outputs.tag }} https://github.com/uxjulia/CrossInk.git crossink-src

      - name: Checkout this fork (for patches)
        uses: actions/checkout@v4
        with:
          path: patch-source

      - name: Apply patches
        run: |
          cd crossink-src
          for patch in ../patch-source/patches/*.patch; do
            if [ -f "$patch" ]; then
              echo "Applying $(basename $patch)..."
              git apply "$patch" || exit 1
            fi
          done

      - name: Set up PlatformIO
        uses: platformio/setup-platformio-action@v4

      - name: Build for ${{ matrix.target }}
        run: |
          cd crossink-src

          case "${{ matrix.target }}" in
            default)
              pio run -e X3 -e X4
              ;;
            sticky)
              pio run -e X3_sticky
              ;;
            x4-pro)
              pio run -e X4_Pro
              ;;
          esac

      - name: Prepare binaries
        run: |
          mkdir -p release-bins
          cd crossink-src/.pio/build

          case "${{ matrix.target }}" in
            default)
              cp X3/firmware.bin ../../release-bins/crASHink-${{ steps.tag.outputs.tag }}-x3x4.bin
              cp X4/firmware.bin ../../release-bins/crASHink-${{ steps.tag.outputs.tag }}-x3x4-alt.bin
              ;;
            sticky)
              cp X3_sticky/firmware.bin ../../release-bins/crASHink-${{ steps.tag.outputs.tag }}-sticky.bin
              ;;
            x4-pro)
              cp X4_Pro/firmware.bin ../../release-bins/crASHink-${{ steps.tag.outputs.tag }}-x4pro.bin
              ;;
          esac

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: binaries-${{ matrix.target }}
          path: release-bins/

  release:
    needs: [check-release, build]
    if: needs.check-release.outputs.new-release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG=$(curl -s https://api.github.com/repos/uxjulia/CrossInk/releases/latest | jq -r '.tag_name')
          else
            TAG=${{ needs.check-release.outputs.release-tag }}
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: all-binaries

      - name: Flatten binaries
        run: |
          mkdir -p final-release
          find all-binaries -name "*.bin" -exec cp {} final-release/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}-crASHink
          name: "CrASHink ${{ steps.tag.outputs.tag }}"
          body: |
            ## CrASHink ${{ steps.tag.outputs.tag }}

            Custom CrossInk build with patches applied:
            - Patch 1: Remove clipping limit (256 → 65535)
            - Patch 2: Clickable clippings with modal dialog
            - Patch 3: Frontlight warm/cold percentage indicators

            Based on upstream: uxjulia/CrossInk@${{ steps.tag.outputs.tag }}
          files: final-release/*.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG
        run: |
          echo "## [${{ steps.tag.outputs.tag }}-crASHink] - $(date +%Y-%m-%d)" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Added" >> CHANGELOG.md
          echo "- Frontlight warm/cold percentage indicators in status bar" >> CHANGELOG.md
          echo "- Clickable clippings with modal dialog" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Changed" >> CHANGELOG.md
          echo "- Increased clipping limit from 256 to 65535 per book" >> CHANGELOG.md
          echo "" >> CHANGELOG.md

      - name: Commit CHANGELOG update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG for ${{ steps.tag.outputs.tag }}-crASHink" || true
          git push
